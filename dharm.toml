# dharm 默认配置（仓库根目录；也可用环境变量 DHARM_CONFIG 指定路径）
# 命令行参数会覆盖这里的值。
# 注意：speed / transpose 写在乐谱 .txt 里时优先用乐谱的，播放中改过会写回乐谱。
# press_early / hold_extra 只认本文件，每首曲子都用这一套。

# 标定 profile 名（profiles/<name>.json）；设了就可以省略 play -p
profile = "z60u"

# —— 游戏发声延迟补偿（始终生效）——
# 模式1 press_early：下一音提前多少 ms 按下
press_early = 100
# 模式2 hold_extra：每个音多按住多少 ms
hold_extra = 0
# 净起音间隔 ≈ 谱面时值 + hold_extra - press_early
# 播放中 z/x 调 press_early、c/v 调 hold_extra（步长 50），结束写回本文件

# 开奏倒计时秒数
countdown = 1

# 默认倍速（仅当乐谱没有 speed: 时）
speed = 1.0

# 多设备时指定 adb serial（一般不用）
# serial = "xxxxxxxx"
