[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-harmonica"
version = "0.1.0"
description = "Delta Force harmonica practice assist for Linux (score parsing & guided play)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "delta-harmonica contributors" }]
dependencies = [
    "typer>=0.12",
    "pynput>=1.7",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dharm = "delta_harmonica.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delta_harmonica = ["py.typed"]
